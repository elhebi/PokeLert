name: PokeLert
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: monitor
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: State und Website speichern
        run: |
          git config user.name "pokelert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json docs/index.html
          git diff --staged --quiet || (git commit -m "Update" && git pull --rebase && git push)
